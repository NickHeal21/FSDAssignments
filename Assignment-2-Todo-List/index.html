<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="todo-app">
    <p class="eyebrow">ASSIGNMENT 02</p>
    <h1>A little more<br /><span>done each day.</span></h1>
    <p class="intro">A simple list for what matters today.</p>
    <form id="task-form" class="task-form">
      <label class="visually-hidden" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" />
      <button type="submit" aria-label="Add task">+</button>
    </form>
    <div class="list-heading"><span>Your tasks</span><span id="task-count">0 tasks</span></div>
    <ul id="task-list" aria-label="To-do tasks"></ul>
    <p id="empty-state" class="empty">Nothing on the list yet. Add a task to get started.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
