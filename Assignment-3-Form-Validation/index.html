<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <p class="eyebrow">ASSIGNMENT 03</p>
    <h1>Create your account</h1>
    <p class="intro">Fill in your details to get started.</p>
    <form id="registration-form" novalidate>
      <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" /><small class="error" id="name-error"></small></div>
      <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" /><small class="error" id="email-error"></small></div>
      <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="10 digits" /><small class="error" id="phone-error"></small></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" /><small class="hint">At least 8 characters, with a letter and a number.</small><small class="error" id="password-error"></small></div>
      <button type="submit">Create account</button>
      <p id="success" class="success" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
