<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator">
    <p class="eyebrow">ASSIGNMENT 01</p>
    <h1>Simple calculator</h1>
    <p class="intro">Enter two numbers and choose an operation.</p>
    <label for="first-number">First number</label>
    <input id="first-number" type="number" step="any" placeholder="e.g. 24" />
    <label for="operator">Operation</label>
    <select id="operator" aria-label="Operation">
      <option value="+">Addition (+)</option>
      <option value="-">Subtraction (−)</option>
      <option value="*">Multiplication (×)</option>
      <option value="/">Division (÷)</option>
    </select>
    <label for="second-number">Second number</label>
    <input id="second-number" type="number" step="any" placeholder="e.g. 6" />
    <button id="calculate" type="button">Calculate</button>
    <p id="result" class="result" role="status" aria-live="polite">Your result will appear here.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
